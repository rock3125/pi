    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a0f0d'/%3E%3Ctext x='16' y='23' font-family='serif' font-size='20' font-weight='700' fill='%2364f0a8' text-anchor='middle'%3E%CF%80%3C/text%3E%3C/svg%3E" />

  <body>
    <!--
      THESIS: piview is an instrument clamped onto a running interpreter, not a
      dashboard about one. It refuses the card-grid admin panel: the console is a
      spine down the middle, flanked by the two things a spine cannot show - what
      the database holds, and who last touched it.
      OWN-WORLD: near-black ink ground (#080b0a) under a faint scanline; phosphor
      green for bindings and life, amber for `no`, signal red for parse errors,
      violet for anything an agent did. JetBrains Mono carries every piece of
      prolog; Archivo in tracked small caps carries the chrome. Rules, not cards:
      hairline dividers and gutter marks separate regions.
      STORY: you see pi is alive and what it holds, you type a goal, solutions
      land as an aligned table, and the feed shows the agent working the same
      database beside you.
      FIRST VIEWPORT: a status rail across the top; database rail left; console
      centre, transcript above a live `?-` prompt; relations/activity rail right.
      The prompt is the primary action and is focused on load.
      FORM: terminal instrument, chosen by the author from three directions.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the
      finish review, the verdict, and DESIGN.md.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
